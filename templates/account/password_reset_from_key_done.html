{% extends "base.html" %}

{% block title %}Password Changed - CIO Hub{% endblock %}

{% block content %}
<div class="card auth-card" style="text-align: center;">
    <div style="margin-bottom: 1.5rem;">
        <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="#1c9b65" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
            <polyline points="22 4 12 14.01 9 11.01"/>
        </svg>
    </div>
    <h1>Password Changed</h1>
    <p style="margin-bottom: 1.8rem;">Your password has been reset successfully. You can now sign in with your new password.</p>

    <a href="{% url 'account_login' %}" class="btn btn-primary" style="width: 100%;">Sign In</a>
</div>
{% endblock %}
