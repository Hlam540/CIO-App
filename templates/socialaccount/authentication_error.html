{% extends "base.html" %}
{% load i18n %}

{% block title %}Login Error - CIO Hub{% endblock %}

{% block content %}
<div class="card auth-card" style="text-align: center;">
    <div style="margin-bottom: 1.5rem;">
        <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="#e74c3c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"/>
            <line x1="12" y1="8" x2="12" y2="12"/>
            <line x1="12" y1="16" x2="12.01" y2="16"/>
        </svg>
    </div>
    <h1>Login Failed</h1>
    <p style="margin-bottom: 1.8rem;">An error occurred while signing in with your third-party account. Please try again or use a different sign-in method.</p>

    <a href="{% url 'account_login' %}" class="btn btn-primary" style="width: 100%; margin-bottom: 0.8rem;">Try Again</a>
    <a href="{% url 'home' %}" class="btn btn-secondary" style="width: 100%; text-align: center;">Go to Homepage</a>
</div>
{% endblock %}
