{% extends "base.html" %}

{% block title %}Choose Your Role - CIO Hub{% endblock %}

{% block content %}
<div class="card auth-card" style="text-align: center; max-width: 580px;">
    <h1>Welcome to CIO Hub</h1>
    <p style="margin-bottom: 0.4rem;">Hi, <strong>{{ user.get_full_name|default:user.username }}</strong>!</p>
    <p style="margin-bottom: 2rem;">To get started, please select your role in the organization.</p>

    <form method="POST" style="display: grid; gap: 1rem;">
        {% csrf_token %}

        <label class="role-option" id="opt-executive">
            <input type="radio" name="role" value="executive" required
                   onchange="document.getElementById('opt-executive').classList.add('selected'); document.getElementById('opt-general').classList.remove('selected');">
            <div>
                <strong style="font-size: 1.1rem; color: #172033;">Executive Member</strong>
                <p>For leadership positions — Presidents, Chairs, Treasurers, and Subcommittee Heads.</p>
            </div>
        </label>

        <label class="role-option" id="opt-general">
            <input type="radio" name="role" value="general" required
                   onchange="document.getElementById('opt-general').classList.add('selected'); document.getElementById('opt-executive').classList.remove('selected');">
            <div>
                <strong style="font-size: 1.1rem; color: #172033;">General Member</strong>
                <p>For participating members without leadership responsibilities.</p>
            </div>
        </label>

        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 0.5rem;">Continue</button>
    </form>
</div>

<style>
    .role-option {
        display: flex;
        align-items: flex-start;
        gap: 0.9rem;
        text-align: left;
        padding: 1.2rem;
        border-radius: var(--radius-md);
        border: 2px solid var(--border);
        background: var(--surface-soft);
        cursor: pointer;
        transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }
    .role-option:hover {
        border-color: #a4b8e0;
    }
    .role-option.selected {
        border-color: var(--primary);
        box-shadow: 0 0 0 4px rgba(53, 89, 224, 0.12);
        background: #f0f4ff;
    }
    .role-option input[type="radio"] {
        margin-top: 0.35rem;
        accent-color: var(--primary);
        width: 18px;
        height: 18px;
        flex-shrink: 0;
    }
    .role-option p {
        margin-top: 0.3rem;
        font-size: 0.92rem;
    }
</style>
{% endblock %}
